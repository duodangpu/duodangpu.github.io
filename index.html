<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f4f5f3"><meta name="description" content="多当铺的作品合集与直播回放。"><title>多当铺 | 作品与直播</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><script src="data.js" defer></script><script src="app.js" defer></script></head>
<body>
<header><div class="top"><a class="brand" href="#works"><span class="brand-mark" aria-hidden="true">▶</span>多当铺</a><nav aria-label="主导航"><a class="active" href="#works">作品</a><a href="#live">直播回放</a></nav><div class="search" id="search-panel"><span class="search-icon" aria-hidden="true"></span><input id="search" type="search" aria-label="搜索作品或节目" placeholder="搜索作品或节目" autocomplete="off"></div><button type="button" class="search-toggle" aria-label="搜索" aria-controls="search-panel" aria-expanded="false"><span class="search-icon" aria-hidden="true"></span></button></div></header>
<main><section id="works" class="catalog"><div class="heading"><h1>作品合集</h1><span class="count" id="work-count" aria-live="polite"></span></div><div class="filters" id="filters" aria-label="作品分类"></div><div class="grid" id="work-grid"></div><p class="empty" id="empty-works" hidden>没有找到作品</p></section>
<section id="live" class="live"><div class="live-heading"><h2>直播回放</h2><span class="count" id="live-count" aria-live="polite"></span></div><div id="live-list"></div><p class="empty" id="empty-live" hidden>没有找到节目</p></section><noscript><p>请启用 JavaScript 查看作品与节目单。</p></noscript></main>
<footer>多当铺 <span>·</span> 多多想当当</footer>
<dialog id="work-dialog" aria-labelledby="dialog-title"><button type="button" class="close" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button><div class="dialog-layout"><div class="dialog-art" id="dialog-art"></div><div class="dialog-info"><h2 id="dialog-title"></h2><div id="dialog-tags" class="tags"></div><div id="dialog-links" class="watch-links"></div></div></div><div id="related-lives"></div></dialog>
</body></html>
